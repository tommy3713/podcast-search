name: ci

# Pull requests run every check (main only accepts merged PRs, and a required check that
# never reports would block the merge). Pushes to main publish the images and deploy them.
# Changes under deploy/ build and deploy too, so the VPS's compose file and Caddy site
# never drift from the images; Markdown-only pushes skip everything.
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', 'memory/**', '.claude/**']
  workflow_dispatch:

# A PR's newer push cancels its older run. Every push to main gets its own group, so a deploy
# waiting for the worker never holds up (or cancels) the next build; deploys queue in deploy.yml.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: bash tests/remote-deploy.test.sh

  # The web target runs `next build`; building on PRs also catches files missing from the .dockerignore allowlist
  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [web, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/gooaye-${{ matrix.target }}:latest
            ghcr.io/${{ github.repository_owner }}/gooaye-${{ matrix.target }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.target }}
          # PR builds read the cache but don't write it, so main's cache isn't evicted
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,mode=max,scope={0}', matrix.target) || '' }}

  deploy:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      sha: ${{ github.sha }}
    # Without this the called workflow sees the vps environment's variables but not its secrets
    secrets: inherit
