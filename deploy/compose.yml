# Lives at /opt/gooaye on the VPS next to web.env, worker.env and data/.
# Caddy runs separately in /opt/proxy (deploy/proxy) and reaches web over the shared `proxy` network.
# Deploy: deploy/deploy.sh
name: gooaye

x-app: &app
  restart: unless-stopped
  # The deploy user (uid 1001) owns /opt/gooaye/data
  user: "1001:1001"
  volumes:
    - ./data:/data
  # No ports: only the shared Caddy is reachable from outside (Docker-published ports bypass ufw)

services:
  web:
    <<: *app
    image: ghcr.io/tommy3713/gooaye-web:${TAG:-latest}
    env_file: web.env
    environment:
      APP_ENV: production
      DB_PATH: /data/app.db
      NEXTAUTH_URL: https://gooaye-notes.com
    mem_limit: 512m
    # The worker creates and migrates the database
    depends_on: [worker]
    networks:
      proxy:
        # Other apps share this network, so Caddy addresses web by a unique alias
        aliases: [gooaye-web]

  worker:
    <<: *app
    image: ghcr.io/tommy3713/gooaye-worker:${TAG:-latest}
    env_file: worker.env
    environment:
      APP_ENV: production
      DB_PATH: /data/app.db
      SITE_URL: https://gooaye-notes.com
    mem_limit: 768m

networks:
  proxy:
    external: true
